#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=1024m

#Gradle
org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

#Publishing
# Coordinates for the eventual Maven Central release. JitPack ignores GROUP and
# publishes under com.github.<owner>, so it only takes effect after that migration.
# VERSION_NAME is the version the next tag will carry; keep tag and value in sync.
GROUP=com.novage
VERSION_NAME=0.1.0
