name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint & Spotless
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "zulu"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Run Detekt and Spotless
        run: ./gradlew spotlessCheck detekt

  lint-ios:
    name: SwiftFormat & SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run SwiftFormat (check)
        run: >
          docker run --rm -v "$PWD/iosDemo:/work"
          ghcr.io/nicklockwood/swiftformat:0.62.1
          --lint /work --reporter github-actions-log
      - name: Run SwiftLint
        if: success() || failure()
        run: >
          docker run --rm -v "$PWD/iosDemo:/work" -w /work
          ghcr.io/realm/swiftlint:0.65.0
          --strict --reporter github-actions-logging

  android:
    name: Android Demo & Library Tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "zulu"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Cache Kotlin/Native (Konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Build Android Demo
        run: ./gradlew :androidDemo:assembleDebug
      - name: Run tests
        run: ./gradlew :p2pml:allTests

  ios:
    name: iOS Framework & Demo
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "zulu"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Cache Kotlin/Native (Konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Link release framework (device)
        run: ./gradlew :p2pml:linkReleaseFrameworkIosArm64
      - name: Build iOS Demo
        run: |
          cd iosDemo
          xcodebuild -project iosDemo.xcodeproj -scheme iosDemo -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ONLY_ACTIVE_ARCH=YES ARCHS=arm64 build
