name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without a leading v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ inputs.version }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Reject a malformed version
        run: |
          if ! printf '%s' "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${{ inputs.version }}' is not semver. JitPack uses the tag verbatim as the artifact version, so a leading v would publish as :v${{ inputs.version }}."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fail if the tag already exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ inputs.version }} already exists. Releases are immutable — pick a new version."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "zulu"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native (Konan)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Pin VERSION_NAME to the release version
        run: |
          sed -i '' -E "s/^VERSION_NAME=.*/VERSION_NAME=${{ inputs.version }}/" gradle.properties
          grep '^VERSION_NAME=' gradle.properties

      - name: Assemble the release XCFramework
        run: ./gradlew :p2pml:assembleP2PMLReleaseXCFramework

      - name: Zip the XCFramework
        run: |
          # SPM requires the .xcframework at the root of the archive.
          cd p2pml/build/XCFrameworks/release
          zip -r -q "$GITHUB_WORKSPACE/P2PML.xcframework.zip" P2PML.xcframework

      - name: Point Package.swift at this release
        run: |
          CHECKSUM=$(swift package compute-checksum P2PML.xcframework.zip)
          URL="https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/P2PML.xcframework.zip"
          sed -i '' -E "s#url: \".*\"#url: \"${URL}\"#" Package.swift
          sed -i '' -E "s#checksum: \".*\"#checksum: \"${CHECKSUM}\"#" Package.swift
          echo "checksum=${CHECKSUM}" >> "$GITHUB_ENV"
          cat Package.swift

      - name: Commit the release coordinates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties Package.swift
          # Tolerant so a re-run after a failed publish does not abort here: the sed
          # rewrites above are idempotent, so the second run has nothing new to stage.
          git commit -m "release: ${{ inputs.version }}" || echo "already committed; re-run"
          # main is PR-only under a ruleset, so the release commit gets its own branch.
          # Nothing is lost: the tag is what both distributors resolve, so the commit
          # never has to be an ancestor of main. Forced so a re-run can overwrite its
          # own half-finished branch.
          git push --force origin "HEAD:refs/heads/release/${{ inputs.version }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Written to a file rather than inlined: the body contains backticks and quotes
          # that are painful to escape through a shell argument.
          cat > release-notes.md <<EOF
          ### Swift Package Manager

          \`\`\`swift
          .package(url: "https://github.com/${{ github.repository }}.git", from: "${{ inputs.version }}")
          \`\`\`

          ### Gradle (JitPack)

          \`\`\`kotlin
          repositories { maven("https://jitpack.io") }
          implementation("com.github.${{ github.repository_owner }}.${{ github.event.repository.name }}:p2pml:${{ inputs.version }}")
          \`\`\`

          XCFramework checksum: \`${{ env.checksum }}\`
          EOF

          # --target creates the tag on this exact commit as part of creating the release,
          # so a failure here cannot leave a tag pointing at an unreleased commit.
          # No --generate-notes: gh documents prepending only via --notes, not --notes-file,
          # and a flag conflict would fail after the commit was already pushed.
          # A semver prerelease suffix (0.0.1-beta) must not be published as "Latest",
          # or the repo page advertises a throwaway build as the current version.
          case "${{ inputs.version }}" in
            *-*) PRERELEASE=--prerelease ;;
            *)   PRERELEASE= ;;
          esac

          gh release create "${{ inputs.version }}" \
            P2PML.xcframework.zip \
            --target "${{ env.sha }}" \
            --title "${{ inputs.version }}" \
            --notes-file release-notes.md \
            $PRERELEASE

      - name: Drop the release branch
        run: |
          # The tag now holds the commit, so the branch has served its purpose and the
          # commit stays reachable without it. Deleting keeps the branch list clean.
          # Non-fatal: the release is already published by this point.
          git push origin --delete "release/${{ inputs.version }}" || true
